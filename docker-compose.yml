version: '3.8'

services:

  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: eduevent-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: eventdb
    volumes:
      - mongodb_data:/data/db
    networks:
      - eduevent-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduevent-backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/eventdb
      JWT_SECRET: 022c1cfb4c513717f7b9c6659e49b6a1
      NODE_ENV: production
      EMAIL_USER: murari2061@gmail.com
      EMAIL_PASS: jwkb qfon gzfs lrcd
      EMAIL_FROM: murari2061@gmail.com
      ADMIN_SECRET_KEY: examiner@2025
      CLOUDINARY_CLOUD_NAME: dc8zbsjik
      CLOUDINARY_API_KEY: 272389958614853
      CLOUDINARY_API_SECRET: HpxQV1KlyqSlMIwgIeNyM7P21j8
      FRONTEND_URL: http://localhost
    depends_on:
      - mongodb
    networks:
      - eduevent-network

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduevent-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - eduevent-network

# Persistent volume for MongoDB data
volumes:
  mongodb_data:

# Network for containers to communicate
networks:
  eduevent-network:
    driver: bridge